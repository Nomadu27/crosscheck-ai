[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name        = "crosscheck-ai"
version     = "1.0.0"
description = "AI Dev Team -- multi-agent coding pipeline where Claude codes and other models advise, debug, review, and plan. Built on OpenRouter."
readme      = "README.md"
license     = "LicenseRef-Proprietary"
requires-python = ">=3.10"
authors     = [{ name = "Steddy Nova Srl", email = "info@yuyai.pro" }]
keywords    = ["ai", "llm", "review", "openrouter", "multi-agent", "code-review", "insaits", "observer"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "questionary>=2.0",
    "watchdog>=4.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
monitor   = ["insa-its>=1.0"]
webhook   = ["fastapi>=0.110", "uvicorn>=0.29"]
dashboard = ["fastapi>=0.110", "uvicorn>=0.29"]
chat      = ["fastapi>=0.110", "uvicorn>=0.29"]
policy    = ["pyyaml>=6.0"]
local     = []
all       = ["insa-its>=1.0", "fastapi>=0.110", "uvicorn>=0.29", "pyyaml>=6.0"]
dev       = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.urls]
Homepage   = "https://github.com/Nomadu27/crosscheck-ai"
Repository = "https://github.com/Nomadu27/crosscheck-ai"
Issues     = "https://github.com/Nomadu27/crosscheck-ai/issues"

[project.scripts]
crosscheck = "crosscheck.cli:cli"

[tool.setuptools.packages.find]
where   = ["."]
include = ["crosscheck*"]

[tool.setuptools.package-data]
crosscheck = ["chat_ui/*.html", "chat_ui/*.js", "chat_ui/*.css"]

[tool.ruff]
target-version = "py310"
line-length    = 100
select         = ["E", "F", "I", "UP", "B"]
ignore         = ["E501"]

[tool.mypy]
python_version         = "3.10"
strict                 = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
